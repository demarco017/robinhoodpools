services:
  app:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - rhpools-data:/data
    ports:
      - "3000:8196"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - PYTHONUNBUFFERED=1
    command: ["sh", "-ec", "pip install --quiet uv && uv sync --locked && exec uv run rhpools --host 0.0.0.0 --port 8196 --public-origin https://3000-$${BASE44_PUBLIC_HOST_SUFFIX}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8196/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure

volumes:
  rhpools-data:
